<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-label="When a company has been resolved, the writer counts its open deals. None: create a deal at the chosen stage. One: update value and people but leave the stage unchanged. Two or more: skip and name the candidates on the card.">
  <style>
    .bg { fill: #f3f5f8; }
    .box { fill: #ffffff; stroke: #8a97ab; stroke-width: 1; }
    .box.accent { stroke: #d9691a; stroke-width: 1.6; }
    .t { font: 500 12.5px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; fill: #1b2432; }
    .t2 { font: 400 11px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; fill: #5c6a80; }
    .edge { stroke: #4d5b70; stroke-width: 1.4; fill: none; }
    .edge.accent { stroke: #d9691a; stroke-width: 2.2; }
    .elbl { font: 400 11px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; fill: #3d4a5e; }
    .elbl.accent { fill: #d9691a; font-weight: 600; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5b70"/></marker>
    <marker id="arr2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9691a"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="236"/>

  <rect class="box" x="20" y="90" width="150" height="56" rx="4"/>
  <text class="t" x="95" y="115" text-anchor="middle">Company resolved</text>
  <text class="t2" x="95" y="132" text-anchor="middle">by domain, id or name</text>

  <rect class="box" x="220" y="90" width="160" height="56" rx="4"/>
  <text class="t" x="300" y="115" text-anchor="middle">Count its open deals</text>
  <text class="t2" x="300" y="132" text-anchor="middle">not Won, not Lost</text>

  <rect class="box" x="480" y="20" width="260" height="56" rx="4"/>
  <text class="t" x="610" y="45" text-anchor="middle">Create a deal</text>
  <text class="t2" x="610" y="62" text-anchor="middle">at the stage chosen on the form</text>

  <rect class="box accent" x="480" y="90" width="260" height="56" rx="4"/>
  <text class="t" x="610" y="115" text-anchor="middle">Update value, add the person</text>
  <text class="t2" x="610" y="132" text-anchor="middle">stage left unchanged</text>

  <rect class="box" x="480" y="160" width="260" height="56" rx="4"/>
  <text class="t" x="610" y="185" text-anchor="middle">Skip the deal</text>
  <text class="t2" x="610" y="202" text-anchor="middle">card names the candidates</text>

  <line class="edge" x1="170" y1="118" x2="216" y2="118" marker-end="url(#arr2)"/>
  <path class="edge" d="M380,118 H420 V48 H476" marker-end="url(#arr2)"/>
  <text class="elbl" x="448" y="42" text-anchor="middle">none</text>
  <line class="edge accent" x1="380" y1="118" x2="476" y2="118" marker-end="url(#arr2-a)"/>
  <text class="elbl accent" x="452" y="112" text-anchor="middle">one</text>
  <path class="edge" d="M380,118 H420 V188 H476" marker-end="url(#arr2)"/>
  <text class="elbl" x="448" y="204" text-anchor="middle">two or more</text>
</svg>
